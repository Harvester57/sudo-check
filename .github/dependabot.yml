version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "go-deps"
    assignees:
      - "Harvester57"
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "actions"
    assignees:
      - "Harvester57"
    groups:
      github-actions:
        patterns:
          - "*"
