name: Go CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Tidiness and Checksums
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check Code Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Go Vulnerability Check (govulncheck)
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Ensure cvtsudoers Oracle Is Available
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v cvtsudoers >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y sudo
          fi
          cvtsudoers -V

      - name: Run Unit Tests and Oracle Parity Suite (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          SUDO_CHECK_REQUIRE_ORACLE: "1"
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run Unit Tests (Windows)
        if: matrix.os == 'windows-latest'
        run: go test -v -race ./...

      - name: Publish Coverage Summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          TOTAL_COV=$(tail -n 1 coverage.txt | awk '{print $3}')
          {
            echo "### Go Test Coverage: ${TOTAL_COV}"
            echo ""
            echo "<details><summary>Function Coverage Breakdown</summary>"
            echo ""
            echo '```text'
            cat coverage.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce Coverage Floor
        if: matrix.os == 'ubuntu-latest'
        run: |
          MIN_COVERAGE=85
          TOTAL_COV=$(tail -n 1 coverage.txt | awk '{print $3}')
          echo "Total coverage: ${TOTAL_COV} (minimum required: ${MIN_COVERAGE}%)"
          awk -v total="${TOTAL_COV%\%}" -v min="${MIN_COVERAGE}" \
            'BEGIN { if (total < min) { exit 1 } }'

      - name: Upload Coverage Report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 5

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Standalone Binary (Cross-Compilation)
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          if [ "${TARGET_GOOS}" = "windows" ]; then
            BINARY_NAME="sudo-check-${TARGET_GOOS}-${TARGET_GOARCH}.exe"
          else
            BINARY_NAME="sudo-check-${TARGET_GOOS}-${TARGET_GOARCH}"
          fi

          env CGO_ENABLED=0 GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" \
            go build -ldflags="${LDFLAGS}" -trimpath -v -o "dist/${BINARY_NAME}"

      - name: Smoke Test Native Binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/sudo-check-linux-amd64 version
          ./dist/sudo-check-linux-amd64 scan testdata/corpus/distros/archlinux_sudoers.sudoers -f json >/dev/null

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sudo-check-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 5

  release:
    name: Create Tagged Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: sudo-check-binary-*
          merge-multiple: true

      - name: Generate SBOM
        uses: sbomify/sbomify-action@fc7f05256cca65c26c8010da5faf3203e9477e5c # v26.9.0
        env:
          LOCK_FILE: go.mod
          OUTPUT_FILE: dist/sudo-check-sbom.cdx.json
          COMPONENT_NAME: sudo-check
          COMPONENT_VERSION: ${{ github.ref_name }}
          ENRICH: true
          UPLOAD: false

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum sudo-check-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release already exists. Uploading assets..."
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            echo "Creating new release..."
            gh release create "${RELEASE_TAG}" dist/* --title "Release ${RELEASE_TAG}" --generate-notes
          fi
