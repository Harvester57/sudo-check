name: Scheduled Fuzzing

on:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-fuzzing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # A crasher in one target must not cancel the other targets mid-run;
      # artifacts from every failing leg are preserved.
      fail-fast: false
      matrix:
        include:
          - target: FuzzParseString
            package: ./pkg/parser
          - target: FuzzAuditJSONPolicy
            package: ./pkg/audit
          - target: FuzzParseSudoVersion
            package: ./pkg/audit

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Disabled: setup-go snapshots GOCACHE keyed on go.sum, which would
          # restore a stale fuzz corpus and shadow the explicit corpus cache
          # below. The fuzz job builds a single package; a cold build is cheap.
          cache: false

      # Accumulate the generated fuzz corpus across runs: restore the most
      # recent corpus before fuzzing, save the grown corpus afterwards (the
      # cache post step runs even when the fuzz step fails, so inputs found
      # before a crash are kept). Go never prunes corpus entries; growth tapers
      # as coverage saturates, but if baseline gathering ever becomes slow,
      # bump the key prefix below (e.g. ...-v2-) to reset the corpus. Each
      # matrix target keeps its own corpus; Go namespaces the cache by package
      # and target underneath the shared path, so legs never collide.
      - name: Restore Accumulated Fuzz Corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # Fuzzing mode runs the seed corpus first, then generates novel inputs
      # for 5 minutes. On a crash, the failing input is written to
      # <package>/testdata/fuzz/<target>/ so it becomes a permanent regression
      # seed once committed.
      - name: Run ${{ matrix.target }}
        run: go test -run='^$' -fuzz=${{ matrix.target }} -fuzztime=5m ${{ matrix.package }}

      - name: Collect Failing Inputs and Generated Corpus
        if: failure()
        run: |
          mkdir -p fuzz-artifacts
          if [ -d ${{ matrix.package }}/testdata/fuzz ]; then
            cp -r ${{ matrix.package }}/testdata/fuzz fuzz-artifacts/crashers
          fi
          FUZZ_CACHE="$(go env GOCACHE)/fuzz"
          if [ -d "$FUZZ_CACHE" ]; then
            mkdir -p fuzz-artifacts/generated-corpus
            cp -r "$FUZZ_CACHE"/. fuzz-artifacts/generated-corpus/
          fi

      - name: Upload Fuzz Artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz-artifacts/
          retention-days: 30
